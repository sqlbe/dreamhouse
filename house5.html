<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상자 나무 숲</title>
<style>
:root{--bg:#f6f8fa;--ink:#22303c;--sub:#6b7785;--line:#dbe2e8;--acc:#2f6f9f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}.sub{color:var(--sub);font-size:12px}
button{font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--ink);cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{flex:1;min-height:0;position:relative;overflow:hidden}main canvas{display:block}
.ctl{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 24px)}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.lbl{font-size:11px;color:var(--sub);width:52px}.num{font-weight:700;font-size:12px;color:var(--acc)}
.hint{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--sub);max-width:280px;line-height:1.6}
body.ui-off .ctl,body.ui-off .hint{display:none}
@media(max-width:768px){.sub{display:none}.ctl{left:8px;right:8px;bottom:8px}}
</style>
</head>
<body>
<header>
  <h1>상자 나무 숲</h1>
  <span class="sub">줄기 코어에 상자 집이 가지처럼 매달리고, 가지 지붕마다 정원 · 프로토타입 1차</span>
  <button id="uiToggle">☰ 메뉴</button>
</header>
<main id="view">
  <div class="hint"><b>줄기</b> = 엘리베이터·계단·배관 코어<br><b>가지</b> = 트럭 크기 상자 집(3.6×12m) — 줄기에만 매달려 이웃과 닿지 않음(소음 없음)<br>층마다 40°씩 돌아가며 뻗어 아랫집 지붕이 정원이 돼요</div>
  <div class="ctl">
    <div class="row"><span class="lbl">키우기</span><button id="add1">가지 +1</button><button id="add6">가지 +6</button><button id="tree">줄기 +</button><button id="replay">처음부터</button></div>
    <div class="row"><span class="lbl">현재</span><span class="num" id="count"></span></div>
    <div class="row"><span class="lbl">시간</span><button data-time="day" class="on">낮</button><button data-time="night">밤</button></div>
  </div>
</main>
<script>
const uiBtn=document.getElementById('uiToggle');
function setUI(on){document.body.classList.toggle('ui-off',!on);uiBtn.classList.toggle('on',on);uiBtn.textContent=on?'☰ 메뉴 숨기기':'☰ 메뉴 보기'}
setUI(!(matchMedia('(max-width: 768px)').matches||matchMedia('(pointer: coarse)').matches));uiBtn.onclick=()=>setUI(document.body.classList.contains('ui-off'));
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;view.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.1,2000);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.495;
const hemi=new THREE.HemisphereLight(0xffffff,0x9aa08c,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-40,near:1,far:300});scene.add(sun,sun.target);
const D=d=>d*Math.PI/180,std=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
function add(geo,mat,x,y,z,p=scene,sh=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(sh){m.castShadow=m.receiveShadow=true}p.add(m);return m}
const box3=(x1,x2,y1,y2,z1,z2,mat,p)=>add(new THREE.BoxGeometry(x2-x1,y2-y1,z2-z1),mat,(x1+x2)/2,(y1+y2)/2,(z1+z2)/2,p);
const glass=new THREE.MeshPhysicalMaterial({color:0xcfeaf7,transparent:true,opacity:.35,roughness:.05,side:THREE.DoubleSide,depthWrite:false});
const M={ground:std(0xdfe4da),plaza:std(0xece6dc),core:std(0xf2f3f5,{roughness:.5}),lawn:std(0x86b35f),plant:std(0x6aa34f),plant2:std(0x8fbf5a),trunk:std(0x5b3a24),
  win:new THREE.MeshStandardMaterial({color:0x9fc4dc,roughness:.15,metalness:.3,emissive:0xffcf8a,emissiveIntensity:0})};
const SKIN=[0xc9a27a,0xf1ede6,0xb98b62,0xe6dccd,0xd8c3a5].map(c=>std(c,{roughness:.7}));

/* 줄기(코어) 반지름 3m · 층 3.6m · 층마다 가지 3개(120°) · 층마다 40°씩 회전 */
const R=3,FH=3.6,LEN=12;
const trees=[],branches=new Map();let anims=[],nb=0;
const forest=new THREE.Group();scene.add(forest);
function buildTree(t){const g=new THREE.Group();g.position.set(t.x,0,t.z);forest.add(g);t.g=g;const H=(t.top+1)*FH+3;
  add(new THREE.CylinderGeometry(R,R*1.15,H,32),M.core,0,H/2,0,g);
  for(let L=1;L<=t.top;L++)add(new THREE.CylinderGeometry(R+.05,R+.05,.5,32),glass,0,L*FH+1.6,0,g,false);   // 층마다 유리 띠(엘리베이터 홀)
  add(new THREE.CylinderGeometry(R+1,R+1,.4,32),M.lawn,0,H+.2,0,g);add(new THREE.CylinderGeometry(.3,.4,3,8),M.trunk,0,H+1.9,0,g);add(new THREE.SphereGeometry(2.6,14,10),M.plant,0,H+4.2,0,g);
  add(new THREE.CylinderGeometry(R+3,R+3,.08,32),M.plaza,0,.04,0,g)}
function buildBranch(t,L,k,anim){const g=new THREE.Group();g.position.set(t.x,L*FH,t.z);g.rotation.y=D(k*120+L*40+t.rot);forest.add(g);
  const s=SKIN[(L+k+t.rot)%SKIN.length],e=R+LEN;
  const b=new THREE.Group();g.add(b);
  box3(R-.2,e,0,3.3,-1.8,1.8,s,b);                                                     // 상자 집
  for(const z of[-1.82,1.82])box3(R+2,e-1,1.0,2.4,z-.02,z+.02,M.win,b);                  // 옆 창 띠
  add(new THREE.CylinderGeometry(1.8,1.8,3.1,24,1,false,0,Math.PI),glass,e,1.65,0,b,false).rotation.y=0;   // 끝: 둥근 유리 발코니
  box3(R+4,e-.3,3.3,3.55,-1.6,1.6,M.lawn,b);                                            // 지붕 정원
  for(let i=0;i<3;i++)add(new THREE.SphereGeometry(.55+.2*((i+L)%2),10,8),(i+k)%2?M.plant:M.plant2,R+6+i*2.4,3.95,((i*7+L)%3-1)*.9,b);
  branches.set(t.i+'|'+L+'|'+k,g);nb++;
  if(anim!=null){b.scale.x=.001;anims.push({b,t:-anim,dur:1.5})}}
function addBranch(anim){for(let L=1;L<=12;L++)for(const t of trees){if(L>t.top)continue;const ks=[0,1,2].filter(k=>!branches.has(t.i+'|'+L+'|'+k));
    if(ks.length){buildBranch(t,L,ks[Math.floor(Math.random()*ks.length)],anim);return true}}return false}
const SPOTS=[[0,0,12],[34,6,9],[12,-32,7],[-32,-14,10],[-20,28,8],[46,-34,11]];
function addTree(){const s=SPOTS[trees.length];if(!s)return false;const t={x:s[0],z:s[1],top:s[2],rot:trees.length*17,i:trees.length};trees.push(t);buildTree(t);return true}
function count(){document.getElementById('count').textContent=`상자 집 ${nb}채 · 줄기 ${trees.length}그루`}
const pending=()=>anims.reduce((m,a)=>Math.max(m,-a.t),0);
function start(anim){forest.clear();trees.length=0;branches.clear();anims=[];nb=0;addTree();addTree();addTree();for(let i=0;i<70;i++)addBranch(anim?pending()+.15:null);count()}
document.getElementById('add1').onclick=()=>{addBranch(pending()+.1);count()};
document.getElementById('add6').onclick=()=>{for(let i=0;i<6;i++)addBranch(pending()+.15);count()};
document.getElementById('tree').onclick=()=>{if(addTree())for(let i=0;i<6;i++)addBranch(pending()+.15);count()};
document.getElementById('replay').onclick=()=>start(true);
let time='day';function applyEnv(){const n=time==='night',sky=n?0x0d1828:0xcfe6f3;scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,200,600);
  sun.position.set(-50,100,80);sun.intensity=n?.25:2.4;hemi.intensity=n?.2:.95;M.win.emissiveIntensity=n?1.5:0}
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{time=b.dataset.time;document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('on',x===b));applyEnv()});
add(new THREE.PlaneGeometry(1200,1200).rotateX(-Math.PI/2),M.ground,0,-.01,0).castShadow=false;
for(let i=0;i<30;i++){const a=Math.random()*6.28,r=55+Math.random()*25,x=10+r*Math.cos(a),z=-5+r*Math.sin(a);add(new THREE.CylinderGeometry(.15,.2,1.8,8),M.trunk,x,.9,z);add(new THREE.SphereGeometry(1.4,10,8),M.plant,x,2.7,z)}
function resize(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(view);resize();start(false);applyEnv();camera.position.set(75,48,85);controls.target.set(12,16,-6);
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);
  for(const a of anims){a.t+=dt;const k=Math.min(1,Math.max(0,a.t/a.dur));a.b.scale.x=Math.max(.001,1-Math.pow(1-k,3))}
  if(anims.length&&anims.every(a=>a.t>=a.dur))anims=[];
  controls.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
